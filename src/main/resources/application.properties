spring.application.name=LostAndFound

# Server Port (Render dynamically assigns PORT)
server.port=${PORT:8080}

# Database Configuration (PostgreSQL)
# We use SPRING_DATASOURCE_URL in the environment (which we will configure in render.yaml) 
# or default to a local postgres instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lost_found_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Max Size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upload Directory property (Custom)
upload.dir=uploads/
