<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Lost & Found'">Lost & Found</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:fragment="navbar" class="nav-bar">
    <a href="/" class="logo">Lost & Found</a>
    <a href="/" class="nav-button" th:classappend="${currentUri == '/'} ? 'active' : ''">Dashboard</a>
    <a href="/report-lost" class="nav-button" th:classappend="${currentUri == '/report-lost'} ? 'active' : ''">Report Lost</a>
    <a href="/report-found" class="nav-button" th:classappend="${currentUri == '/report-found'} ? 'active' : ''">Report Found</a>
    <a href="/search" class="nav-button" th:classappend="${currentUri == '/search'} ? 'active' : ''">Search Items</a>
</div>

</body>
</html>
